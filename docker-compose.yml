# docker-compose.yml — RATISS Aeon Prime v9.5 multi-environnements
#
# Usage:
#   VPS / serveur :  docker compose up ratiss-server -d
#   HuggingFace   :  docker compose up ratiss-hf -d      (port 7860)
#   Dev local     :  docker compose up ratiss-dev -d     (port 12000, hot reload)
#
# v9.5 : modules sécurité (vuln_scanner + transdisc_security).
#        Le vault de clés API est monté comme volume persistant (config/).
#        Les audits chiffrés sont persistés dans audits/.
#        Les workspaces sont persistés dans workspace/.

services:
  # ── Serveur principal (VPS / production) ──────────────────────────────────
  ratiss-server:
    build: .
    container_name: ratiss-server
    ports:
      - "${RATISS_PORT:-7860}:7860"
    volumes:
      - ./workspace:/app/workspace
      - ./data:/app/data
      - ./config:/app/config        # vault de clés API persistant
      - ./audits:/app/audits        # v9.5: audits chiffrés persistants
    environment:
      - RATISS_HOST=0.0.0.0
      - RATISS_PORT=7860
      - RATISS_RAM_LIMIT_MB=7500
      - PYTHONUNBUFFERED=1
      # v9.5: module sécurité (désactivé par défaut, activation par mot de passe)
      - RATISS_VULN_SCANNER_ENABLED=0
      - RATISS_AUDITS_DIR=/app/audits
      # Injectez vos cles via un .env file (non commite)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - IBM_QUANTUM_TOKEN=${IBM_QUANTUM_TOKEN:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:7860/api/health', timeout=5); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Hugging Face Spaces (port 7860, ReadMe only) ─────────────────────────
  ratiss-hf:
    build: .
    container_name: ratiss-hf
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./audits:/app/audits        # v9.5: audits chiffrés persistants
    environment:
      - RATISS_HOST=0.0.0.0
      - RATISS_PORT=7860
      - RATISS_RAM_LIMIT_MB=7500
      - PYTHONUNBUFFERED=1
      - RATISS_VULN_SCANNER_ENABLED=0
      - RATISS_AUDITS_DIR=/app/audits
    restart: unless-stopped
    profiles: ["huggingface"]

  # ── Dev local (hot reload, port 12000) ───────────────────────────────────
  ratiss-dev:
    build: .
    container_name: ratiss-dev
    ports:
      - "12000:7860"
    volumes:
      - .:/app
      - /app/app/frontend/node_modules
      - ./config:/app/config
      - ./audits:/app/audits        # v9.5: audits chiffrés persistants
    environment:
      - RATISS_HOST=0.0.0.0
      - RATISS_PORT=7860
      - RATISS_RAM_LIMIT_MB=7500
      - PYTHONUNBUFFERED=1
      - RATISS_VULN_SCANNER_ENABLED=0
      - RATISS_AUDITS_DIR=/app/audits
    command: python -m uvicorn app.server:app --host 0.0.0.0 --port 7860 --reload
    restart: unless-stopped
    profiles: ["dev"]
