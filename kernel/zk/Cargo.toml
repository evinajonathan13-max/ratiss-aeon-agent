[package]
name = "ratiss_v9_zk_verifier"
version = "9.0.0"
edition = "2021"
authors = ["Jonathan Evina <evinajonathan13@gmail.com>"]
description = "RATISS V9 Aeon Prime Minimalist ZK Circuit (RISC Zero / CPU Only)"

[dependencies]
# Minimalist CPU dependencies (No CUDA, No heavy features)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
